name: test

channels:
  - conda-forge

dependencies:
  # Base depends
  - python
  - pip

  # SEAMM
  - seamm
  # seamm.Node still uses the bibtexparser 1.x API (loads)
  - bibtexparser<2
  - molsystem
  - numpy
  - scipy

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pygments
  
  # Pip-only installs
  - pip:
    # Documentation
    - rinohtype
    - sphinx-rtd-theme
    - pystemmer
